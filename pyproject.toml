[project]
name = "voicerl"
version = "0.1.0"
description = "Reward symmetries are not conserved: experiments on RL drift in speech models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.15",
    "transformers>=5.23",
    "numpy>=2.0",
    "scipy>=1.14",
    "rapidfuzz>=3.10",
    "soundfile>=0.13",
    "soxr>=0.5",
    "datasets>=4.0",
    "pyarrow>=18",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicerl"]
